name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Check flake
        run: nix flake check --all-systems --no-build
      - name: Check lock file is complete
        run: nix flake lock --no-update-lock-file
      - name: Check one node per pin (no duplicate nixpkgs)
        run: |
          test "$(jq '[.nodes[] | select(.original.repo == "nixpkgs")] | length' flake.lock)" -eq 2
